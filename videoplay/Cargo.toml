[package]
name = "dlos-videoplay"
version = "0.1.0"
edition = "2021"
authors = ["Doglinkify contributors"]
description = "Modern minimalist silent video player for DoglinkOS-2nd"
license = "GPL-3.0-only"
repository = "https://github.com/Doglinkify/dlos-videoplay"
keywords = ["os", "video", "player", "doglinkos", "no_std"]
categories = ["multimedia::video", "no-std"]

[[bin]]
name = "videoplay"
path = "src/main.rs"

[features]
default = ["codec-mjpeg", "codec-xz"]
dlos = ["dep:good_memory_allocator"]
sim = ["dep:sdl2"]
codec-mjpeg = ["dep:zune-jpeg", "dep:zune-core"]
codec-xz = ["dep:lzma-rust2"]
codec-h264 = ["dep:openh264"]

[dependencies]
zune-jpeg  = { version = "0.5",  default-features = false, optional = true }
zune-core  = { version = "0.5",  default-features = false, optional = true }
lzma-rust2 = { version = "0.18", default-features = false, optional = true }
openh264   = { version = "0.7",  optional = true }
good_memory_allocator = { version = "0.1",  optional = true }
sdl2       = { version = "0.37", optional = true, default-features = false, features = ["use-pkgconfig"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
